services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: recallweave
      POSTGRES_USER: recallweave
      POSTGRES_PASSWORD: recallweave
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U recallweave -d recallweave"]
      interval: 5s
      timeout: 3s
      retries: 12

volumes:
  pgdata:
